name: PR Validation
"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    name: Plugin versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check plugin and marketplace versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/plugin_versions.py check --base-ref "$BASE_SHA"